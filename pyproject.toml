[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "nba-prediction"
version = "0.1.0"
description = "NBA player stats prediction system with ML models and Monte Carlo simulation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "catboost>=1.2",
    "lightgbm>=4.0",
    "xgboost>=3.0",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "numpy>=1.26",
    "pandas>=2.1",
    "nba_api>=1.5",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "requests>=2.31",
    "aiohttp>=3.9",
    "matplotlib>=3.8",
    "plotly>=5.18",
    "seaborn>=0.13",
    "joblib>=1.3",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "psutil>=5.9",
    "torch",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "coverage>=7.4",
]

[project.scripts]
nba-train = "train:main"
nba-update = "update_data:main"
nba-simulate = "simulate_season:main"
nba-query = "query_prob:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
