# NBA Prediction System - Default Configuration

# Data paths and storage settings
data:
  data_dir: "data"
  models_dir: "models"
  cache_dir: "cache"
  raw_data_file: "nba_games.csv"
  use_parquet: false
  parquet_compression: "zstd"

# Training configuration
training:
  targets:
    - "PTS"
    - "REB"
    - "AST"
    - "STL"
    - "BLK"
    - "TOV"
  test_split_date: "2025-01-01"
  temporal_decay_lambda: 0.023
  outlier_percentile: 0.99
  use_sample_weights: true
  use_adversarial_validation: true
  adversarial_threshold: 0.7
  use_feature_selection: true
  min_samples_per_player: 10

training_presets:
  full:
    description: "Full CatBoost + Transformer stack with the complete feature set."
    default_mode: "standard"
    default_model_size: "M"
    transformer_enabled: true
    recent_seasons: null
    rolling_windows: [3, 5, 10, 20, 50]
    feature_engineer:
      enable_groups:
        - "rolling"
        - "efficiency"
        - "momentum"
        - "context"
        - "fatigue"
        - "minutes_confidence"
        - "rest_density"
        - "matchup"
        - "opponent_strength"
        - "pace"
        - "team_role"
        - "lineup_stability"
        - "injury_opportunity"
        - "teammate_usage"
        - "recency_form"
        - "archetype"
        - "defense_position"
        - "target_encoding"
        - "league_rank"
  small:
    description: "Fast CatBoost-first preset with a reduced feature set and no Transformer."
    default_mode: "quick"
    default_model_size: "S"
    transformer_enabled: false
    recent_seasons: 2
    rolling_windows: [3, 5, 10, 20]
    feature_engineer:
      enable_groups:
        - "rolling"
        - "efficiency"
        - "momentum"
        - "pace"
        - "opponent_strength"
        - "archetype"

# Feature engineering configuration
features:
  rolling_windows:
    - 3
    - 5
    - 10
    - 20
    - 50
  use_matchup_features: true
  use_fatigue_features: true
  use_momentum_features: true
  use_contextual_features: true
  max_lag_days: 7

# Extended feature engineering configuration
features_ext:
  rolling_windows:
    - 3
    - 5
    - 10
    - 20
    - 50
  ewma_spans:
    - 3
    - 5
    - 10
    - 20
  trend_window_pairs:
    - [3, 10]
    - [5, 20]
  hot_streak_threshold: 1.15
  cold_streak_threshold: 0.85
  rest_days_max: 7
  matchup_history_window: 5
  bayesian_shrinkage_factor: 10
  league_percentile_window: 2000
  league_percentile_min_periods: 500
  target_encoding_smoothing: 20
  usage_windows:
    - 5
    - 10
  use_matchup_features: true
  use_fatigue_features: true
  use_momentum_features: true
  use_contextual_features: true
  max_lag_days: 7

# Simulation configuration
simulation:
  default_num_sims: 5000
  max_workers: 4
  use_gpu: true
  cache_rosters: true
  injury_probability_threshold: 0.1
  minutes_distribution: "dirichlet"
  correlation_injection: true
  clutch_adjustment: true
  seed: 42
  use_context_engine: true
  use_player_correlations: true
  use_betting_calibration: true
  use_minutes_model: true
  use_error_calibration: true
  four_factors_weight: 0.25
  use_four_factors: true
  detailed_path_threshold: 250
  fast_path_threshold: 1000

# Detailed simulation parameters
simulation_params:
  # Fatigue multipliers (days of rest)
  fatigue_3in4: 0.96
  fatigue_back_to_back: 0.975
  fatigue_2_days: 1.0
  fatigue_3_days: 1.01
  fatigue_4plus_days: 1.005
  
  # Defense adjustment bounds
  defense_pts_range: [0.85, 1.15]
  defense_reb_range: [0.90, 1.10]
  defense_ast_range: [0.92, 1.08]
  defense_tov_range: [0.90, 1.10]
  
  # Pace distribution
  pace_multiplier_mean: 1.0
  pace_multiplier_std: 0.04
  pace_clip_range: [0.88, 1.12]
  
  # Environment factor
  env_factor_mean: 1.0
  env_factor_std: 0.05
  env_factor_clip_range: [0.88, 1.15]
  
  # Minutes distribution
  minutes_std_high: 2.0
  minutes_std_low: 3.5
  minutes_threshold: 32.0
  
  # Team totals bounds
  team_totals_min: [70, 30, 15, 3, 2, 5]
  team_totals_max: [160, 70, 45, 20, 15, 28]
  
  # Dirichlet concentrations
  dirichlet_concentrations: [70.0, 90.0, 85.0, 95.0, 95.0, 90.0]
  
  # Correlation noise
  noise_intensity: 0.25
  
  # Clutch settings
  clutch_score_threshold: 118.0
  clutch_boost_multiplier: 1.3
  blowout_bench_multiplier: 1.5
  
  # FG2/FG3 adjustments
  fg2_pct_boost: 1.05
  
  # Three point frequency modifiers
  three_pt_freq_high_shooter: 1.5
  three_pt_freq_low_shooter: 0.8
  three_pt_clutch_modifier: 1.2
  three_pt_blowout_modifier: 0.8
  
  # FT rate modifiers
  ft_rate_fg3_modifier: 0.8
  ft_rate_fg2_modifier: 1.2
  
  # Overtime settings
  overtime_margin_threshold: 3.0
  overtime_points_mean: 5.0
  overtime_points_std: 2.5
  overtime_points_clip: [0, 15]
  overtime_home_win_prob: 0.48
  
  # Home court advantage
  home_edge: 2.5
  
  # Stat correlation matrix (6x6 for PTS, REB, AST, STL, BLK, TOV)
  stat_correlation_matrix:
    - [1.0, 0.35, 0.45, 0.15, 0.08, 0.20]
    - [0.35, 1.0, 0.25, 0.12, 0.18, 0.10]
    - [0.45, 0.25, 1.0, 0.18, 0.06, 0.28]
    - [0.15, 0.12, 0.18, 1.0, 0.22, 0.35]
    - [0.08, 0.18, 0.06, 0.22, 1.0, 0.12]
    - [0.20, 0.10, 0.28, 0.35, 0.12, 1.0]

# Logging configuration
logging:
  level: "INFO"
  log_to_file: true
  log_dir: "logs"
  max_bytes: 10000000
  backup_count: 5

# HTTP configuration
http:
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
  timeout: 15
  max_retries: 3
  retry_delay: 2.0

# Cache TTL configuration (in hours unless specified)
cache:
  schedule_ttl_hours: 1.0
  season_schedule_ttl_days: 1.0
  betting_lines_ttl_hours: 4.0
  defense_stats_ttl_hours: 12.0
  lineup_ttl_hours: 6.0
  injury_ttl_minutes: 30.0
  rotowire_ttl_minutes: 30.0
  basketball_ref_ttl_hours: 6.0
  directory: "cache"

# API endpoint configuration
api:
  # NBA Stats API
  nba_stats_base_url: "https://stats.nba.com/stats"
  nba_player_logs_url: "https://stats.nba.com/stats/playergamelogs"
  nba_matchups_url: "https://stats.nba.com/stats/leagueplayerposstats"
  bref_ratings_url_base: "https://www.basketball-reference.com/leagues/NBA_{year}_ratings.html"
  
  # Basketball Reference
  basketball_reference_base_url: "https://www.basketball-reference.com"
  
  # ESPN
  espn_injuries_url: "https://www.espn.com/nba/injuries"
  espn_health_api_url: "https://site.api.espn.com/apis/site/v2/sports/basketball/nba/health"
  
  # Action Network (Betting)
  action_network_base_url: "https://www.actionnetwork.com/nba"
  
  # RotoWire
  rotowire_lineups_url: "https://www.rotowire.com/basketball/nba-lineups.php"
  rotowire_lineups_daily_url: "https://www.rotowire.com/basketball/nba-lineups-daily.php"
  rotowire_projections_url: "https://www.rotowire.com/basketball/projections-daily.php"
  
  # Rate limiting
  rate_limit_delay: 0.6
  team_fetch_delay: 0.5
  team_fetch_delay_bref: 1.5

# Team configuration
teams:
  mappings_file: "data/team_mappings.json"
  switch_profiles_file: "data/team_switch_profiles.json"
  interior_defense_file: "data/team_interior_defense.json"
  default_opponent: "LAL"

# League average statistics (fallback defaults when dynamic fetch unavailable)
league_averages:
  points_per_100: 114.0
  offensive_rating: 114.0
  defensive_rating: 114.0
  pace: 100.0
  effective_fg_pct: 0.54
  turnover_pct: 0.135
  offensive_rebound_pct: 0.25
  free_throw_rate: 0.23
  
  # Default game totals
  default_total: 225.0
  implied_home_pts: 112.5
  default_home_rating: 114.0
  default_away_rating: 114.0
  
  # Player position defaults
  fg_pct: 0.470
  fg3_pct: 0.360
  ft_pct: 0.75
  
  # Historical spread std
  historical_std_total: 11.0
  historical_std_spread: 10.5
  
  # Vegas calibration
  vegas_weight: 0.30

# Model configurations
catboost:
  enabled: true
  # Core hyperparameters (tuned for NBA stat prediction)
  iterations: 1500
  learning_rate: 0.02
  depth: 6
  l2_leaf_reg: 5.0
  random_strength: 1.0
  bagging_temperature: 0.5
  border_count: 254
  thread_count: -1
  random_seed: 42
  early_stopping_rounds: 80

  # Advanced tree structure
  grow_policy: "Depthwise"
  min_data_in_leaf: 10
  score_function: "Cosine"
  rsm: 0.8                       # Random subspace method (column sampling per split)

  # Langevin stochastic gradient boosting (regularization via noise injection)
  langevin: true
  diffusion_temperature: 10000.0

  # Simplified active path: primary CatBoost + quantiles; no extra MAE branch.
  use_multi_loss: false
  multi_loss_rmse_weight: 0.6
  multi_loss_mae_weight: 0.4

  # Quantile regression for calibrated uncertainty intervals
  use_quantile_models: true
  quantile_alpha_low: 0.1
  quantile_alpha_high: 0.9

  # Per-target tuning: PTS/REB/AST get deeper trees; STL/BLK/TOV get
  # heavier regularization suited to sparse count distributions
  use_per_target_tuning: true

lstm:
  enabled: false
  hidden_size: 192
  num_layers: 3
  dropout: 0.15
  learning_rate: 0.0008
  batch_size: 512
  epochs: 120
  patience: 15
  random_seed: 42
  sequence_length: 12
  bidirectional: true

transformer:
  enabled: true
  d_model: 128
  nhead: 8
  num_encoder_layers: 3
  dim_feedforward: 512
  max_seq_length: 10
  hidden_size: 128
  num_layers: 3
  dropout: 0.15
  learning_rate: 0.0008
  batch_size: 256
  epochs: 60
  patience: 12
  random_seed: 42

gnn:
  enabled: false
  num_node_features: 64
  num_edge_features: 16
  num_graph_layers: 3
  hidden_size: 192
  num_layers: 3
  dropout: 0.15
  learning_rate: 0.0008
  batch_size: 512
  epochs: 120
  patience: 15
  random_seed: 42
  use_attention: true

# Ensemble configuration
ensemble:
  enabled: true
  method: "ridge"
  cv_folds: 5
  use_temporal_refinement: true
  use_advanced_temporal: false

# Self-optimizing ensemble weight tuning
# Continuously retunes blend weights as the season progresses
# without retraining underlying models
self_optimization:
  enabled: false
  accept_margin: 0.01
  verification_margin: 0.02
  holdout_window_days: 14
  verification_window_days: 30
  optimizer_method: "Nelder-Mead"
  max_iterations: 100
  schedule: "manual"
  min_samples_per_area: 50
  retry_on_failure: true
  max_retries: 3
